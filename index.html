<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translator | Power Edge</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="wrapper">

            <div class="text-input">

                <textarea
                    spellcheck="false"
                    class="from-text"
                    placeholder="Enter text"
                    aria-label="Text to translate">
                </textarea>

                <textarea
                    spellcheck="false"
                    readonly
                    class="to-text"
                    placeholder="Translation"
                    aria-label="Translated text">
                </textarea>

            </div>

            <ul class="controls">

                <li class="row from">

                    <div class="icons">
                        <i id="from-speak" class="fas fa-volume-up"></i>
                        <i id="from-copy" class="fas fa-copy"></i>
                    </div>

                    <select id="from-language"
                    aria-label="Source language"></select>

                </li>

                <li class="exchange">
                    <i class="fas fa-exchange-alt"></i>
                </li>

                <li class="row to">

                    <select id="to-language"
                    aria-label="Target language"></select>

                    <div class="icons">
                        <i id="to-speak" class="fas fa-volume-up"></i>
                        <i id="to-copy" class="fas fa-copy"></i>
                    </div>

                </li>

            </ul>

        </div>

        <button id="translate-btn">Translate Text</button>

    </div>

    <footer>
        <p>Created by R. Gurucharan & E. Uthayakumar</p>
    </footer>

    <script src="language.js"></script>
    <script src="script.js"></script>

</body>
</html>
